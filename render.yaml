services:
  - type: web
    name: atoms-lab
    runtime: node
    plan: free
    buildCommand: echo "zero-dependency, nothing to build"
    startCommand: node --experimental-sqlite server/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: ATOMS_LLM_BASE
        sync: false
      - key: ATOMS_LLM_MODEL
        sync: false
      - key: ATOMS_LLM_KEY
        sync: false
